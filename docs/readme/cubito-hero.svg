<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1192 520" width="1192" height="520" role="img" aria-labelledby="t d">
  <title id="t">Cubito: a fan-out seen as a scene</title>
  <desc id="d">A green main worktree cube spawns three blue child cubes along drawn edges; one child pauses in amber waiting for input, another finishes. A command palette types the prompt and a status ticker narrates the run.</desc>
  <style>
    /* Motion language mirrors the Cubito landing: one 14 s loop, shared easing, cubes pop in after their edge draws. */
    :root { --ease: cubic-bezier(.22,.8,.28,1); }
    text { font-family: 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #23313a; }
    .muted { fill: #5c6b75; }
    .subtle { fill: #8a97a0; }
    .accent { fill: #4d8a00; }
    .amber-ink { fill: #a36b00; }
    .edge { stroke: #2ea8ff; stroke-width: 2; fill: none; stroke-dasharray: 330; stroke-dashoffset: 330; }
    .edge-static { stroke: #cfd8de; stroke-width: 2; fill: none; }
    .pop { transform-box: fill-box; transform-origin: center; opacity: 0; }
    .anim { animation-duration: 14s; animation-iteration-count: infinite; animation-timing-function: var(--ease); }
    .drawA { animation-name: drawA; } .drawB { animation-name: drawB; } .drawC { animation-name: drawC; }
    .popA { animation-name: popA; } .popB { animation-name: popB; } .popC { animation-name: popC; }
    .pal { animation-name: pal; opacity: 0; }
    .cycle { animation-name: cycle; }
    .offAt55 { animation-name: offAt55; } .onAt55 { animation-name: onAt55; opacity: 0; }
    .offAt70 { animation-name: offAt70; } .onAt70 { animation-name: onAt70; opacity: 0; }
    .calloutIn { animation-name: calloutIn; opacity: 0; }
    .hud0 { animation-name: hud0; } .hud1 { animation-name: hud1; opacity: 0; } .hud2 { animation-name: hud2; opacity: 0; } .hud3 { animation-name: hud3; opacity: 0; }
    .pulse { animation: pulse 1.6s ease-in-out infinite; }
    .blink { animation: blink 1.05s steps(1) infinite; }

    @keyframes drawA { 0%,25% { stroke-dashoffset: 330 } 29%,100% { stroke-dashoffset: 0 } }
    @keyframes drawB { 0%,29% { stroke-dashoffset: 330 } 33%,100% { stroke-dashoffset: 0 } }
    @keyframes drawC { 0%,33% { stroke-dashoffset: 330 } 37%,100% { stroke-dashoffset: 0 } }
    @keyframes popA { 0%,27% { opacity: 0; transform: scale(.7) } 30%,100% { opacity: 1; transform: none } }
    @keyframes popB { 0%,31% { opacity: 0; transform: scale(.7) } 34%,100% { opacity: 1; transform: none } }
    @keyframes popC { 0%,35% { opacity: 0; transform: scale(.7) } 38%,100% { opacity: 1; transform: none } }
    @keyframes pal { 0% { opacity: 0; transform: translateY(-6px) } 4%,20% { opacity: 1; transform: none } 24%,100% { opacity: 0; transform: none } }
    @keyframes cycle { 0%,88% { opacity: 1 } 94%,100% { opacity: 0 } }
    @keyframes offAt55 { 0%,55% { opacity: 1 } 58%,100% { opacity: 0 } }
    @keyframes onAt55 { 0%,55% { opacity: 0 } 58%,100% { opacity: 1 } }
    @keyframes offAt70 { 0%,70% { opacity: 1 } 73%,100% { opacity: 0 } }
    @keyframes onAt70 { 0%,70% { opacity: 0 } 73%,100% { opacity: 1 } }
    @keyframes calloutIn { 0%,57% { opacity: 0; transform: translateY(6px) } 60%,100% { opacity: 1; transform: none } }
    @keyframes hud0 { 0%,26% { opacity: 1 } 28%,94% { opacity: 0 } 96%,100% { opacity: 1 } }
    @keyframes hud1 { 0%,26% { opacity: 0 } 28%,56% { opacity: 1 } 58%,100% { opacity: 0 } }
    @keyframes hud2 { 0%,56% { opacity: 0 } 58%,70% { opacity: 1 } 72%,100% { opacity: 0 } }
    @keyframes hud3 { 0%,71% { opacity: 0 } 73%,88% { opacity: 1 } 90%,100% { opacity: 0 } }
    @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .4 } }
    @keyframes blink { 50% { opacity: 0 } }

    @media (prefers-reduced-motion: reduce) {
      .anim, .pulse, .blink { animation: none !important; }
      .pop, .onAt55, .onAt70, .calloutIn, .hud3 { opacity: 1; transform: none; }
      .edge { stroke-dashoffset: 0; }
      .pal, .offAt55, .offAt70, .hud0, .hud1, .hud2 { opacity: 0; }
    }
  </style>
  <defs>
    <pattern id="isogrid" width="68" height="34" patternUnits="userSpaceOnUse">
      <circle cx="0" cy="17" r="1.1" fill="#23313a" fill-opacity=".10"/>
      <circle cx="34" cy="0" r="1.1" fill="#23313a" fill-opacity=".10"/>
      <circle cx="34" cy="34" r="1.1" fill="#23313a" fill-opacity=".10"/>
      <circle cx="68" cy="17" r="1.1" fill="#23313a" fill-opacity=".10"/>
    </pattern>
    <linearGradient id="gridFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".15"/>
    </linearGradient>
    <mask id="gridMask"><rect width="1192" height="520" fill="url(#gridFade)"/></mask>
    <radialGradient id="vignette" cx=".5" cy=".55" r=".7">
      <stop offset="0" stop-color="#f2f5f0" stop-opacity="0"/>
      <stop offset="1" stop-color="#e6ece2" stop-opacity=".9"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="4"/></filter>
    <!-- The landing's cube primitive: top rhombus, left face, right face. -->
    <g id="cube-main">
      <polygon points="0,0 34,17 0,34 -34,17" fill="#b7ff33"/>
      <polygon points="-34,17 0,34 0,72 -34,55" fill="#567f00"/>
      <polygon points="34,17 0,34 0,72 34,55" fill="#85c400"/>
    </g>
    <g id="cube-blue">
      <polygon points="0,0 34,17 0,34 -34,17" fill="#8fd0ff"/>
      <polygon points="-34,17 0,34 0,72 -34,55" fill="#1273b8"/>
      <polygon points="34,17 0,34 0,72 34,55" fill="#2ea8ff"/>
    </g>
    <g id="cube-amber">
      <polygon points="0,0 34,17 0,34 -34,17" fill="#ffcb52"/>
      <polygon points="-34,17 0,34 0,72 -34,55" fill="#8f5c00"/>
      <polygon points="34,17 0,34 0,72 34,55" fill="#e8a200"/>
    </g>
    <g id="cube-idle">
      <polygon points="0,0 34,17 0,34 -34,17" fill="#cdd7dd"/>
      <polygon points="-34,17 0,34 0,72 -34,55" fill="#8d9ba5"/>
      <polygon points="34,17 0,34 0,72 34,55" fill="#aebac2"/>
    </g>
    <clipPath id="typeClip">
      <rect x="0" y="0" width="0" height="24">
        <animate attributeName="width" dur="14s" repeatCount="indefinite" calcMode="discrete"
          keyTimes="0;0.06;0.064;0.068;0.072;0.076;0.08;0.084;0.088;0.092;0.096;0.1;0.104;0.108;0.112;0.116;0.12;0.124;0.128;0.132;0.136;0.14;0.144;0.148;0.152;0.156;0.16;0.164;0.168;0.172;0.176;0.18;0.24"
          values="0;0;8;16;24;32;40;48;56;64;72;80;88;96;104;112;120;128;136;144;152;160;168;176;184;192;200;208;216;224;232;240;248;0"/>
      </rect>
    </clipPath>
  </defs>

  <!-- card -->
  <rect x=".5" y=".5" width="1191" height="519" rx="12" fill="#f2f5f0" stroke="#dbe3e8"/>
  <rect x="1" y="1" width="1190" height="518" rx="12" fill="url(#isogrid)" mask="url(#gridMask)"/>
  <rect x="1" y="1" width="1190" height="518" rx="12" fill="url(#vignette)"/>

  <!-- HUD ticker (top-left) -->
  <g font-size="13">
    <text x="28" y="34" class="subtle" font-size="11" letter-spacing="1.5">CUBITO · PAIRED · RUNTIME 2d94b593</text>
    <g class="anim hud0"><text x="28" y="60"><tspan class="accent">main</tspan><tspan class="muted"> · clean · 1 worktree · 0 agents</tspan></text></g>
    <g class="anim hud1"><text x="28" y="60"><tspan class="accent">fan-out</tspan><tspan class="muted"> · 3 workers spawned · lease gui-run-lease.v1</tspan></text></g>
    <g class="anim hud2"><text x="28" y="60"><tspan class="amber-ink">refactor-store</tspan><tspan class="muted"> · waiting for input · answer from the scene</tspan></text></g>
    <g class="anim hud3"><text x="28" y="60"><tspan class="accent">auth-retry</tspan><tspan class="muted"> · done · press </tspan><tspan>c</tspan><tspan class="muted"> to compare the litter</tspan></text></g>
  </g>

  <!-- command palette (top-right) -->
  <!-- Why: CSS transform animations replace the transform attribute, so positioning lives on an outer group. -->
  <g transform="translate(724 22)"><g class="anim pal">
    <rect width="440" height="86" rx="8" fill="#ffffff" stroke="#cfd8de"/>
    <text x="16" y="26" font-size="11" class="subtle" letter-spacing="1.5">⌘K · FAN-OUT · 3 WORKERS</text>
    <g transform="translate(16 40)">
      <g clip-path="url(#typeClip)">
        <text x="0" y="18" font-size="13.5">retry auth with exponential backoff</text>
      </g>
      <rect class="blink" x="0" y="4" width="8" height="18" fill="#23313a">
        <animate attributeName="x" dur="14s" repeatCount="indefinite" calcMode="discrete"
          keyTimes="0;0.06;0.064;0.068;0.072;0.076;0.08;0.084;0.088;0.092;0.096;0.1;0.104;0.108;0.112;0.116;0.12;0.124;0.128;0.132;0.136;0.14;0.144;0.148;0.152;0.156;0.16;0.164;0.168;0.172;0.176;0.18;0.24"
          values="0;0;8;16;24;32;40;48;56;64;72;80;88;96;104;112;120;128;136;144;152;160;168;176;184;192;200;208;216;224;232;240;248;0"/>
      </rect>
    </g>
    <text x="16" y="76" font-size="11" class="subtle">enter · spawn 3 worktrees from main</text>
  </g></g>

  <!-- ground shadows -->
  <ellipse cx="560" cy="302" rx="64" ry="12" fill="#23313a" fill-opacity=".14" filter="url(#soft)"/>
  <ellipse cx="250" cy="196" rx="52" ry="11" fill="#23313a" fill-opacity=".08" filter="url(#soft)"/>

  <!-- idle node + static edge -->
  <line class="edge-static" x1="284" y1="150" x2="526" y2="228"/>
  <g transform="translate(250 120)"><use href="#cube-idle"/></g>
  <text x="250" y="212" font-size="12" class="muted" text-anchor="middle">cubito/docs-pass</text>

  <!-- main node -->
  <g transform="translate(560 226)" filter="url(#glow)"><use href="#cube-main"/></g>
  <text x="560" y="328" font-size="13" text-anchor="middle"><tspan class="accent" font-weight="600">main</tspan><tspan class="muted"> · clean</tspan></text>

  <!-- the litter: edges draw, cubes pop, states change, whole group resets at loop end -->
  <g class="anim cycle">
    <line class="edge anim drawA" pathLength="330" x1="530" y1="290" x2="330" y2="392"/>
    <line class="edge anim drawB" pathLength="330" x1="560" y1="298" x2="620" y2="392"/>
    <line class="edge anim drawC" pathLength="330" x1="592" y1="286" x2="860" y2="360"/>

    <!-- A · auth-retry: working → done -->
    <g class="pop anim popA">
      <g transform="translate(300 372)">
        <g class="anim offAt70"><use href="#cube-blue"/></g>
        <g class="anim onAt70"><use href="#cube-main"/></g>
      </g>
      <text x="300" y="466" font-size="12" text-anchor="middle">auth-retry</text>
      <g class="anim offAt70"><text x="300" y="484" font-size="11" class="muted" text-anchor="middle">claude · working</text></g>
      <g class="anim onAt70"><text x="300" y="484" font-size="11" class="accent" text-anchor="middle">✓ done · +42 −7</text></g>
    </g>

    <!-- B · refactor-store: working → waiting for input -->
    <g class="pop anim popB">
      <g transform="translate(620 372)">
        <g class="anim offAt55"><use href="#cube-blue"/></g>
        <g class="anim onAt55 pulse"><use href="#cube-amber"/></g>
      </g>
      <text x="620" y="466" font-size="12" text-anchor="middle">refactor-store</text>
      <g class="anim offAt55"><text x="620" y="484" font-size="11" class="muted" text-anchor="middle">codex · working</text></g>
      <g class="anim onAt55"><text x="620" y="484" font-size="11" class="amber-ink" text-anchor="middle">waiting for input</text></g>
      <g transform="translate(930 418)"><g class="anim calloutIn">
        <rect width="240" height="60" rx="6" fill="#fff8e6" stroke="#ffcb52"/>
        <text x="12" y="22" font-size="11" class="amber-ink" letter-spacing="1">QUESTION FROM THE RUN</text>
        <text x="12" y="44" font-size="12">keep the old store? <tspan class="accent">[y]</tspan> <tspan class="muted">[n]</tspan></text>
      </g></g>
    </g>

    <!-- C · rate-limit: working -->
    <g class="pop anim popC">
      <g transform="translate(860 330)"><use href="#cube-blue"/></g>
      <text x="860" y="424" font-size="12" text-anchor="middle">rate-limit</text>
      <text x="860" y="442" font-size="11" class="muted" text-anchor="middle">opencode · working</text>
      <circle class="pulse" cx="788" cy="438" r="3.5" fill="#2ea8ff"/>
    </g>
  </g>

  <!-- keyboard bar -->
  <g transform="translate(28 504)" font-size="11">
    <text x="0" y="0"><tspan font-weight="600">hjkl</tspan><tspan class="muted"> navigate</tspan>
      <tspan dx="18" font-weight="600">s</tspan><tspan class="muted"> spawn</tspan>
      <tspan dx="18" font-weight="600">⇧F</tspan><tspan class="muted"> fan-out</tspan>
      <tspan dx="18" font-weight="600">c</tspan><tspan class="muted"> compare</tspan>
      <tspan dx="18" font-weight="600">x</tspan><tspan class="muted"> live system</tspan>
      <tspan dx="18" font-weight="600">d</tspan><tspan class="muted"> diff</tspan>
      <tspan dx="18" font-weight="600">t</tspan><tspan class="muted"> terminal</tspan></text>
  </g>
</svg>
