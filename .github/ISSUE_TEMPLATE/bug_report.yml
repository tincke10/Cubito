name: Bug report
description: Report a problem with Cubito
title: '[Bug]: '
type: Bug
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Use this form for Cubito bugs. Include enough detail for someone else to reproduce the issue.

        Please write your issue in English. Do not paste tokens or secrets from `.env`.

  - type: input
    id: cubito_version
    attributes:
      label: Cubito version
      description: The release tag or image tag (for example `v0.1.0`), or the commit SHA if you built from source.
      placeholder: v0.1.0
    validations:
      required: true

  - type: dropdown
    id: runtime
    attributes:
      label: How are you running it?
      options:
        - Docker (published image)
        - Docker (built from source)
        - Native macOS
        - Other
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser
      description: Name and version.
      placeholder: Chrome 140
    validations:
      required: false

  - type: textarea
    id: details
    attributes:
      label: Details
      description: What happened, and how can we reproduce it? Logs help (`docker compose logs cubito`), with secrets removed.
      placeholder: |
        Short summary:

        What happened?

        How can we reproduce it?
        1. ...
        2. ...
        3. ...
    validations:
      required: true
