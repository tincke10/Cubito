name: Feature request
description: Suggest an improvement for Cubito
title: '[Feature]: '
type: Feature
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Use this form for new features or workflow improvements.

        Please write your issue in English.

  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to do, and what is missing today? Include a short summary here too.
      placeholder: I cannot tell which child of a fan-out is still running without opening each one.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the change you want to see
      placeholder: Show a status badge on each child node in the worktree graph.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or additional context
      description: Workarounds, related tools, mockups, or anything else that helps
    validations:
      required: false
