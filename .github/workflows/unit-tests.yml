name: Unit tests

on:
  workflow_call:
    inputs:
      node_versions:
        description: JSON array of Node.js major versions to test.
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    name: tests node ${{ matrix.node }} ${{ matrix.shard }}/${{ matrix.shard_total }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ${{ fromJSON(inputs.node_versions) }}
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
        shard_total: [8]

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: ./.github/actions/install-node-dependencies
        with:
          native-runtime: node
          node-version: ${{ matrix.node }}

      - name: Install Electron package binary for tests
        run: node config/scripts/install-electron-package-binary.mjs

      - name: Test shard
        run: pnpm test:ci-shard -- --shard=${{ matrix.shard }}/${{ matrix.shard_total }}
