name: Cubito CI

# Backend-logic gates for the fork: the runtime must build and run without
# Electron, and its unit suite must stay green. The frontend/ 3D client's
# typecheck, tests and lint run in the frontend job below.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: cubito-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  electron-ratchet:
    name: runtime stays electron-free
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: ./.github/actions/install-node-dependencies
        with:
          native-runtime: none

      # The load-bearing guardrail inherited from upstream: bundles the
      # runtime entry points and fails if any module imports electron.
      - name: Check runtime Electron ratchet
        run: node config/scripts/check-runtime-electron-ratchet.mjs

  orcad-smoke:
    name: orcad build + terminal smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: ./.github/actions/install-node-dependencies
        with:
          native-runtime: node

      # Builds the CLI and the orcad bundle, boots orcad headless, and runs a
      # real terminal round-trip against it. This is the fork's extraction
      # test: if a change couples the runtime back to the desktop shell, this
      # job screams.
      - name: Build orcad and run terminal smoke
        run: pnpm smoke:orcad-terminal

  unit-tests:
    name: engine unit tests
    uses: ./.github/workflows/unit-tests.yml
    with:
      node_versions: '["24"]'

  # frontend/ is a separate pnpm project (own lockfile/workspace); the shared
  # install-node-dependencies action installs the root graph plus a native
  # runtime the frontend needs neither of, so it installs standalone here.
  frontend:
    name: frontend typecheck + tests + lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.24.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Typecheck frontend
        run: pnpm --dir frontend run typecheck

      - name: Test frontend
        run: pnpm --dir frontend run test

      - name: Lint frontend
        run: pnpm --dir frontend run lint
