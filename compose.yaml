services:
  cubito:
    build: .
    ports:
      # Why: loopback only — orcad launches agents; LAN peers must not reach it.
      - '127.0.0.1:6799:6799'
    environment:
      ORCA_USER_DATA: /data
      CUBITO_WORKTREE_ROOT: /workspaces
      CUBITO_ORCAD_BIND: 0.0.0.0
      CUBITO_PAIRING_ADDRESS: 127.0.0.1:6799
      # Read from the host shell when set (from `claude setup-token`); never written here.
      CLAUDE_CODE_OAUTH_TOKEN:
      # Seals stored credentials (Linear, Jira, ...) at rest; read from the host shell, never written here.
      CUBITO_SECRET_KEY:
      # `accept` in the host shell lets agents bypass permission prompts; unset means they ask.
      CUBITO_AGENT_BYPASS:
      # Tokens for gh/glab (PR/MR creation and git push over HTTPS); read from the host shell, never written here.
      GH_TOKEN:
      GITLAB_TOKEN:
      # `1` in the host shell stops Claude Code's own nonessential traffic (telemetry, error reports, updates); unset keeps its defaults.
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC:
      # The identity agents commit with; the container's own user has none.
      CUBITO_GIT_NAME:
      CUBITO_GIT_EMAIL:
    volumes:
      - cubito-data:/data
      - cubito-workspaces:/workspaces
      - cubito-repos:/repos
    stdin_open: true
    tty: true

volumes:
  cubito-data:
  cubito-workspaces:
  cubito-repos:
