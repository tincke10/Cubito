services:
  cubito:
    build: .
    ports:
      - '6799:6799'
      - '5180:5180'
    environment:
      ORCA_USER_DATA: /data
      CUBITO_WORKTREE_ROOT: /workspaces
      CUBITO_ORCAD_BIND: 0.0.0.0
      CUBITO_PAIRING_ADDRESS: 127.0.0.1:6799
    volumes:
      - cubito-data:/data
      - cubito-workspaces:/workspaces
      - cubito-repos:/repos
    stdin_open: true
    tty: true

volumes:
  cubito-data:
  cubito-workspaces:
  cubito-repos:
